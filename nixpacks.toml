[variables]
NPM_CONFIG_PRODUCTION = "false"

[phases.setup]
cmds = [
  "apt-get update",
  "apt-get install -y curl",
  "curl -fsSL https://deb.nodesource.com/setup_24.x | bash -",
  "apt-get install -y nodejs"
]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run preview -- --host 0.0.0.0 --port ${PORT:-4173}"