[variables]
NPM_CONFIG_PRODUCTION = "false"

[phases.setup]
nixPkgs = ["nodejs-24_x"]

[nixpacks]
nixpkgsArchive = "https://github.com/NixOS/nixpkgs/archive/nixos-24.05.tar.gz"

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run preview -- --host 0.0.0.0 --port ${PORT:-4173}"